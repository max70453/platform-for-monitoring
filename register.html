<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация - Вода Донбасса</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0d3b7a 0%, #1a5fb4 100%);
      padding: 20px;
    }
    .auth-card {
      background: white;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .auth-logo {
      text-align: center;
      margin-bottom: 10px;
    }
    .auth-logo svg {
      width: 64px;
      height: 64px;
    }
    .auth-title {
      font-size: 24px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 8px;
      color: var(--text-primary);
    }
    .auth-subtitle {
      text-align: center;
      color: var(--text-secondary);
      margin-bottom: 10px;
    }
    .auth-form .form-group {
      margin-bottom: 20px;
    }
    .auth-form label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      font-size: 14px;
    }
    .auth-form input, .auth-form select {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    .auth-form input:focus, .auth-form select:focus {
      outline: none;
      border-color: var(--primary);
    }
    .auth-form .btn {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      margin-top: 8px;
    }
    .auth-footer {
      text-align: center;
      margin-top: 24px;
      color: var(--text-secondary);
    }
    .auth-footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
    }
    .auth-footer a:hover {
      text-decoration: underline;
    }
    .error-message {
      background: #fce8e6;
      color: var(--danger);
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }
    .error-message.show {
      display: block;
    }
    .success-message {
      background: #e6f4ea;
      color: var(--secondary);
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }
    .success-message.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <img src="img/logo-voda.png" alt="Вода Донбасса" style="width: 100px; height: auto;" alt="">
      </div>
      <h1 class="auth-title">Регистрация</h1>
      <p class="auth-subtitle">Создайте аккаунт для доступа</p>

      <div class="error-message" id="errorMessage"></div>
      <div class="success-message" id="successMessage">Аккаунт успешно создан!</div>

      <form class="auth-form" id="registerForm">
        <div class="form-group">
          <label for="fullName">ФИО</label>
          <input type="text" id="fullName" required placeholder="Иванов Иван Иванович">
        </div>
        <div class="form-group">
          <label for="role">Должность</label>
          <select id="role" required>
            <option value="">Выберите должность</option>
            <option value="dispatcher">Диспетчер</option>
            <option value="brigade_leader">Бригадир</option>
            <option value="worker">Рабочий</option>
            <option value="admin">Администратор</option>
          </select>
        </div>
        <div class="form-group">
          <label for="login">Логин</label>
          <input type="text" id="login" required placeholder="Придумайте логин">
        </div>
        <div class="form-group">
          <label for="password">Пароль</label>
          <input type="password" id="password" required placeholder="Придумайте пароль">
        </div>
        <div class="form-group">
          <label for="confirmPassword">Подтверждение пароля</label>
          <input type="password" id="confirmPassword" required placeholder="Повторите пароль">
        </div>
        <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
      </form>

      <div class="auth-footer">
        Уже есть аккаунт? <a href="login.html">Войти</a>
      </div>
    </div>
  </div>

  <script>
    const USERS_KEY = 'vodadonbass_users';

    document.getElementById('registerForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const fullName = document.getElementById('fullName').value.trim();
      const role = document.getElementById('role').value;
      const login = document.getElementById('login').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const errorEl = document.getElementById('errorMessage');
      const successEl = document.getElementById('successMessage');

      if (password !== confirmPassword) {
        errorEl.textContent = 'Пароли не совпадают';
        errorEl.classList.add('show');
        successEl.classList.remove('show');
        return;
      }

      const users = JSON.parse(localStorage.getItem(USERS_KEY) || '[]');

      if (users.find(u => u.login === login)) {
        errorEl.textContent = 'Такой логин уже существует';
        errorEl.classList.add('show');
        successEl.classList.remove('show');
        return;
      }

      users.push({
        id: 'user_' + Date.now(),
        fullName,
        role,
        login,
        password,
        createdAt: new Date().toISOString()
      });

      localStorage.setItem(USERS_KEY, JSON.stringify(users));

      errorEl.classList.remove('show');
      successEl.classList.add('show');

      setTimeout(() => {
        window.location.href = 'login.html';
      }, 1500);
    });

    document.getElementById('login').addEventListener('input', function() {
      document.getElementById('errorMessage').classList.remove('show');
    });
  </script>
</body>
</html>
